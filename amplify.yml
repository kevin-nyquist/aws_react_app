version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
applications:
  - appRoot: ./aws_react_app
    name: my-frontend-app
    category: frontend
    source: ./src
    build:
      commands:
        - npm install  # Install dependencies
        - npm run build  # Build the app
    environments:
      - development
      - production