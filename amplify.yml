version: 1
applications:
  - appRoot: ./aws_react_app  # Directory of your Vite-based React app in the monorepo
    name: my-frontend-app
    category: frontend
    source: ./src  # Path to the source code within the app
    frontend:
      phases:
        preBuild:
          commands:
            - npm install   # Install dependencies
        build:
          commands:
            - npm run build  # Build the app using Vite
      artifacts:
        baseDirectory: ./aws_react_app/build  # Vite outputs the build artifacts here
        files:
          - '**/*'  # Include all files from the build folder
      cache:
        paths:
          - node_modules/**/*  # Cache node_modules to speed up subsequent builds

    environments:
      - development
      - production